[project]
name = "pdf-toolkit-server"
version = "0.1.0"
description = "Servidor opcional de pdf-toolkit: Office -> PDF con LibreOffice y hosting del frontend."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "python-docx>=1.1", "pypdf>=4.2"]  # los dos últimos: test real de LibreOffice

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
